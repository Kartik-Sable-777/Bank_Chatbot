version: "3.1"

# =========================================================
# REGEX (IMPORTANT FOR NUMBERS)
# =========================================================

regex:
- name: amount
  pattern: \d+

- name: account_number
  pattern: \d{6,12}


# =========================================================
# LOOKUPS (IMPROVES ENTITY RECOGNITION)
# =========================================================

lookup:
- name: card_type
  examples: |
    - debit
    - credit

- name: facility_type
  examples: |
    - atm
    - branch


